data:
  cache_dir: data/cache
  cache_enabled: true
  min_bars: 43200          # 6 months of 1-min bars
  feed: iex                # iex or sip

backtest:
  default_start: "2024-01-01"
  default_end: "2024-12-31"
  initial_cash: 100000
  commission: 0.001        # 0.1% per trade

dashboard:
  default_symbols: "AAPL"
  default_trading_mode: "Day Trade"
  default_entry_strategy: vwap
  default_exit_strategy: macd_ema
  default_stop_pct: 0.5    # trailing stop % (0.5 = 0.5%)
  panels:
    chart: true
    signals: true
    backtest: true
    position_sizer: true
    news: true
    strategy_editor: true
